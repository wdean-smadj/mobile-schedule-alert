<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Mobile Schedule - Pengurusan jadual dan kenderaan">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mobile Schedule">
  <title>Mobile Schedule</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#0b1220;overflow:hidden}
    body{min-height:100vh;min-height:100dvh}
    #gasApp{display:block;width:100%;height:100vh;height:100dvh;border:0;background:#0b1220}
    #offline{display:none;position:fixed;z-index:5;top:0;left:0;right:0;padding:9px 12px;background:#7b2634;color:#fff;text-align:center;font:13px system-ui,sans-serif}
    #offline.show{display:block}
    #openDirect{display:none;position:fixed;z-index:6;bottom:12px;left:12px;right:12px;padding:12px;border-radius:10px;background:#54d6c7;color:#06202a;text-align:center;text-decoration:none;font:700 14px system-ui,sans-serif}
  </style>
</head>
<body>
  <div id="offline">Tiada sambungan internet. Mobile Schedule memerlukan internet.</div>
  <iframe
    id="gasApp"
    title="Mobile Schedule"
    src="https://script.google.com/macros/s/AKfycbxb4gBaYDYaef0siDhPuwD1nL4LEka4-c5_VmTogn_FGhbi5uYmXS7_5TuIb_uKZc2q/exec"
    allow="clipboard-read; clipboard-write"
    allowfullscreen>
  </iframe>
  <a id="openDirect" href="https://script.google.com/macros/s/AKfycbxb4gBaYDYaef0siDhPuwD1nL4LEka4-c5_VmTogn_FGhbi5uYmXS7_5TuIb_uKZc2q/exec" target="_top" rel="noopener">Buka Mobile Schedule terus</a>
  <script>
    const offlineBar = document.getElementById('offline');
    function updateNetworkState() {
      offlineBar.classList.toggle('show', !navigator.onLine);
    }
    window.addEventListener('online', updateNetworkState);
    window.addEventListener('offline', updateNetworkState);
    updateNetworkState();

    // Fallback pautan terus jika browser tidak dapat memaparkan kandungan GAS dalam frame.
    // Pautan tidak dipaparkan secara automatik kerana halaman GitHub tidak boleh membaca
    // kandungan silang-domain di dalam iframe.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
